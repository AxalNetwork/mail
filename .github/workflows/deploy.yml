name: Test and deploy

# Every push is tested. Pushes to the default branch are deployed to
# Cloudflare (frontend + API on https://mail.axal.vc) once the repository has
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npx vite build
      - name: Check the token can reach the account
        if: steps.creds.outputs.ok == 'true'
        # Lists the accounts this token can use, so a wrong CLOUDFLARE_ACCOUNT_ID
        # (e.g. a zone ID) or a token scoped to another account is obvious.
        run: |
          npx wrangler whoami || true
          echo "D1 databases this token can see:"
          npx wrangler d1 list || true
          if ! npx wrangler d1 info axal-mail; then
            echo "::error::The Cloudflare token can't open the axal-mail database in account $CLOUDFLARE_ACCOUNT_ID (Cloudflare code 7403). Set CLOUDFLARE_ACCOUNT_ID to the Account ID shown under Workers & Pages (not a Zone ID), and give the token Account → D1: Edit and Workers Scripts: Edit on that account, plus Zone → Workers Routes: Edit and DNS: Edit on axal.vc."
            exit 1
          fi
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply axal-mail --remote
      - name: Deploy Worker and assets
        if: steps.creds.outputs.ok == 'true'
        # Pass the client ID only when the repository sets it; an empty --var
        # would replace the value configured on the Worker.
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            npx wrangler deploy --var "GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}"
          else
            npx wrangler deploy
          fi
      - name: Set the assistant API key
        if: steps.creds.outputs.ok == 'true' && env.ANTHROPIC_API_KEY != ''
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        # A new custom domain can take a few minutes to get its certificate.
        run: |
          for i in $(seq 1 18); do
            if curl -fsS https://mail.axal.vc/api/health | grep -q '"ok":true' \
              && curl -fsS https://mail.axal.vc/ | grep -q '<div id="root">'; then
              echo "mail.axal.vc is serving the app and the API."
              curl -fsS https://mail.axal.vc/api/config; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://mail.axal.vc did not serve the app within 3 minutes. Check Workers & Pages → mail → Settings → Domains & Routes."
          curl -sS -i https://mail.axal.vc/api/health | head -20 || true
          exit 1
