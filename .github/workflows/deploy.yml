name: Test and deploy

# Every push is tested. Pushes to the default branch are deployed to
# Cloudflare (frontend + API on https://mail.axal.vc) once the repository has
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # A repository variable or secret; the client ID is public either way.
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: npx vite build
      - name: Check database access
        id: d1
        if: steps.creds.outputs.ok == 'true'
        # Lists the token's accounts and databases, so a token without D1
        # access (Cloudflare codes 7403 / 10000) is obvious from the log.
        run: |
          npx wrangler whoami || true
          if npx wrangler d1 info axal-mail; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The CLOUDFLARE_API_TOKEN secret can't use D1 (axal-mail), so migrations are skipped and the app is deployed anyway. Give that token Account → D1: Edit, or apply new migrations with npm run db:migrate."
          fi
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true' && steps.d1.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply axal-mail --remote
      - name: Deploy Worker and assets
        if: steps.creds.outputs.ok == 'true'
        # Pass the client ID only when the repository sets it; an empty --var
        # would replace the value configured on the Worker.
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            npx wrangler deploy --var "GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}"
          else
            npx wrangler deploy
          fi
      - name: Set the assistant API key
        if: steps.creds.outputs.ok == 'true' && env.ANTHROPIC_API_KEY != ''
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        # A new custom domain can take a few minutes to get its certificate.
        run: |
          # Cloudflare bot protection on the zone may challenge GitHub's runners;
          # that says nothing about the deploy, which wrangler already confirmed.
          if curl -sS -o /dev/null -D - https://mail.axal.vc/api/health | grep -qi '^cf-mitigated: challenge'; then
            echo "::warning::Cloudflare's bot protection challenged this check, so mail.axal.vc can't be verified from GitHub. The deploy itself succeeded."
            exit 0
          fi
          for i in $(seq 1 18); do
            if curl -fsS https://mail.axal.vc/api/health | grep -q '"ok":true' \
              && curl -fsS https://mail.axal.vc/ | grep -q '<div id="root">'; then
              echo "mail.axal.vc is serving the app and the API."
              curl -fsS https://mail.axal.vc/api/config; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://mail.axal.vc did not serve the app within 3 minutes. Check Workers & Pages → mail → Settings → Domains & Routes."
          curl -sS -i https://mail.axal.vc/api/health | head -20 || true
          exit 1
